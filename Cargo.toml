[package]
name = "xmip-core-transport-redpanda"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-redpanda"
description = "Redpanda transport: the Kafka wire protocol to a Redpanda broker, with the Admin API — brokers, cluster configuration, maintenance — consulted before a Location takes work. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Redpanda speaks Kafka on the wire, so the client and
# the far end come from the kafka technology; the Admin API is JSON over
# HTTP, asked on the http technology's kept connections and judged by its
# status rule, and serde_json reads it. Its declaration takes the
# capability's `timeout` (`transport::configured::timeout`), and nothing of
# the kafka technology's: Redpanda rides on Kafka in its code alone.
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
kafka = { workspace = true, optional = true }
http = { workspace = true, optional = true }
net = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:kafka", "dep:http", "dep:net", "dep:serde_json"]
# The declaration alone.
declaration = []

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
