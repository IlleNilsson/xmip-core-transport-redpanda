# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-redpanda"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-redpanda"
description = "Redpanda transport: the Kafka wire protocol to a Redpanda broker, with the Admin API — brokers, cluster configuration, maintenance — consulted before a Location takes work. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Redpanda speaks Kafka on the wire, so the client and
# the far end come from the kafka technology; the Admin API is JSON over
# HTTP, and serde_json reads it.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
kafka = { package = "xmip-core-transport-kafka", git = "https://github.com/IlleNilsson/xmip-core-transport-kafka", branch = "main" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
